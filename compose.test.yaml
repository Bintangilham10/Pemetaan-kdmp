# Invoke with -p kdmp-foundation-test to override COMPOSE_PROJECT_NAME from .env.
# Never run integration fixtures against production.
name: kdmp-foundation-test
services:
  db:
    image: postgis/postgis:18-3.6@sha256:60f6ad1d21ea86a67d47780b9a0d1e1d200500f62b19293fa834d0dea80b8677
    environment:
      POSTGRES_DB: kdmp_test
      POSTGRES_USER: kdmp_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup first}
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:?Run npm run setup first}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?Run npm run setup first}
    volumes:
      - ./infra/db/20-app-roles.sh:/docker-entrypoint-initdb.d/20-app-roles.sh:ro
    tmpfs: [/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U kdmp_owner -d kdmp_test]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    environment:
      KDMP_DATABASE_URL: postgresql+psycopg://kdmp_migrator:${MIGRATOR_PASSWORD}@db:5432/kdmp_test
    command: [alembic, -c, alembic.ini, upgrade, head]
    depends_on:
      db: { condition: service_healthy }
  tests:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: test
    environment:
      KDMP_DATABASE_URL: postgresql+psycopg://kdmp_migrator:${MIGRATOR_PASSWORD}@db:5432/kdmp_test
      TEST_DATABASE_URL: postgresql+psycopg://kdmp_migrator:${MIGRATOR_PASSWORD}@db:5432/kdmp_test
      TEST_READONLY_DATABASE_URL: postgresql+psycopg://kdmp_api:${API_DB_PASSWORD}@db:5432/kdmp_test
    depends_on:
      migrate: { condition: service_completed_successfully }
